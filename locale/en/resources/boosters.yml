boosters:

  levels:
    gui:
      apply: true
    menu_action:
      apply: true
    autosell:
      apply: true

  sell-sources:
    gui:
      stack-mode: true
    menu_action:
      stack-mode: true
    autosell:
      stack-mode: false

  permission-boosters:

    default:
      permission: rseller.booster.default
      coins: 1.0
      points: 1.0
      priority: 1
      source: all

    vip:
      permission: rseller.booster.vip
      coins: 1.5
      points: 1.3
      priority: 2
      source: all

    donate:
      permission: rseller.booster.donate
      coins: 2.0
      points: 1.8
      priority: 3
      source: all
